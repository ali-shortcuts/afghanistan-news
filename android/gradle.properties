# JVM for the Gradle daemon. AGP 8.13 requires JDK 17+; the toolchain here is JDK 21.
# The numbers below are deliberately small: the build must complete on a 2 GB / 2 vCPU
# container (the same shape as the cheapest CI runner), so everything runs in one JVM.
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
# The configuration cache is disabled because KSP + AGP state serialisation is unnecessary
# on a single-module project and costs memory we do not have.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# KSP replaces kapt for Room/Hilt/Moshi: no kapt flags needed any more.
