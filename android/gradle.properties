# Gradle/Kotlin build profile.
#
# These are the *portable* defaults: a normal developer machine and a GitHub runner (7 GB) both
# work with them. The 2 GB container this project was developed in cannot use a 1.5 GB heap, so it
# carries its own override in the Gradle user home
# (~/.cache/gradle-home/gradle.properties), which wins over this file. Keep machine-specific
# memory tuning out of the repository: a committed -Xmx700m silently starved CI's Kotlin
# compiler, which surfaced as "InvocationTargetException" with no error message at all.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.incremental=true
kotlin.code.style=official

# In-process compilation keeps one JVM alive instead of two; on a small machine that is the
# difference between a build and an OOM kill.
kotlin.compiler.execution.strategy=in-process

# The configuration cache is disabled because KSP + AGP state serialisation adds no value to a
# single-module project.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP replaces kapt for Room/Hilt/Moshi: no kapt flags needed any more.
