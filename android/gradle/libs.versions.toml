# Pinned dependency catalog for the Afghanistan News Android client.

# RULE (§396, docs/android/compatibility.md): every artifact below must run on API 21
# (Android 5.0) and ship for both armeabi-v7a and arm64-v8a. The versions are not
# "whatever is newest" — they are the NEWEST release whose own AndroidManifest still
# declares minSdkVersion 21. That claim is verified mechanically, per artifact, by
#     python3 tools/check_deps_api21.py
# which downloads each AAR and reads minSdkVersion / minCompileSdk / minAgpVersion from it.

# Observed floors (2026-09) that justify every pin below:
#   Room            2.7.2  = 21   ·  2.8.x = 23   → 2.7.2 is the ceiling
#   WorkManager    2.10.5  = 21   · 2.11.x = 23   → 2.10.5 is the ceiling
#   Paging          3.3.6  = 21   ·  3.5.x = 23   → 3.3.6 is the ceiling
#   Compose ui      1.9.4  = 21   · 1.10.x = 23   → BOM 2025.11.00 is the ceiling
#   core-ktx       1.16.0  = 21   · 1.19.0 = 23
#   activity       1.10.1  = 21   · 1.13.0 = 23
#   lifecycle       2.9.4  = 21   · 2.11.0 = 23
#   navigation      2.9.5  = 21   · 2.10.x = 24
#   datastore       1.1.7  = 19   ·  1.2.x = 23
#   androidx.hilt   1.2.0  = 19   ·  1.3.0 = 23
#   firebase-bom   33.16.0 = 21 (messaging 24.1.2) · BOM 34 → messaging 25 = 23
# Anything newer than the pins above silently raises the app's floor to Android 6/7 and
# breaks the compatibility gate.
[versions]
# Build toolchain. AGP 8.13.x is the last line that pairs with Kotlin 2.2.x, which is the
# compiler generation the Compose 1.9 runtime was built against.
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
# AndroidX — newest API 21-compatible lines (see the table at the top of this file).
coreKtx = "1.16.0"
appcompat = "1.7.1"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigation = "2.9.5"
room = "2.7.2"
workManager = "2.10.5"
paging = "3.3.6"
datastore = "1.1.7"
hilt = "2.57.2"
hiltAndroidx = "1.2.0"            # androidx.hilt 1.3+ requires minSdk 23
retrofit = "3.0.0"
okhttp = "4.12.0"                 # Retrofit 3 compiles against 4.12; 5.x needs a newer floor review
moshi = "1.15.2"
coil = "3.3.0"                    # Coil 3 is still minSdk 21; 2.x is end-of-line
browser = "1.9.0"
swiperefresh = "1.2.0"
exifinterface = "1.4.1"
firebaseBom = "33.16.0"
coroutines = "1.11.0"
desugar = "2.1.5"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
turbine = "1.2.1"
mockk = "1.14.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Room generates LimitOffsetPagingSource for PagingSource-returning DAOs; since 2.7 that
# generated code lives in this artifact, so it must be on the runtime classpath.
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefresh" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# Compose BOM 2025.11.00 → ui/foundation 1.9.4 + material3 1.4.0, all still minSdk 21.
compose-bom = { module = "androidx.compose:compose-bom", version = "2025.11.00" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# material3 1.4 no longer brings the icon set along, so the *core* set (40 icons, ~90 KB)
# is declared explicitly. The extended set (~30k methods) is deliberately not used.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltAndroidx" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltAndroidx" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltAndroidx" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version = "4.4.4" }
