name: Release APK

# Produces the installable Android artifact (§release engineering).
#
#   • On a tag (v1.0.0)      → builds, verifies, and attaches the APK to a GitHub Release.
#   • Manual dispatch        → same build, artifact only.
#
# Signing: if the repository has the four ANDROID_* secrets below, the APK is signed with the
# project keystore. Without them it still builds — signed with the debug key — so the workflow is
# useful to a fresh clone, and the log says which path it took.
#
#   ANDROID_KEYSTORE_BASE64    base64 of afnews-release.jks   (base64 -w0 afnews-release.jks)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          afnews
#   ANDROID_KEY_PASSWORD       key password
#
# Note: this job runs R8 on a 7 GB runner, which the 2 GB development container used to write
# this project cannot. That is why the release build here is minified while a local
# `-PminifyRelease=false` build is the documented fallback.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      minify:
        description: "Run R8 shrinking"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the Android SDK, so the setup-android action is not used
      # (it installs the long-removed 'tools' package and fails). sdkmanager is not on PATH
      # either, so it is located explicitly, and this step is best-effort: whatever the image
      # already has is enough to build.
      - name: Install SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; using the components already in the image"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            || echo "::warning::component install failed; continuing with what the image provides"

      - name: Restore the release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > keystore.properties
            chmod 600 keystore.jks keystore.properties
            echo "signed=project-keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK will be signed with the debug key and cannot be published to a store."
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependency gate — every artifact must still declare minSdk 21
        working-directory: android
        run: python3 tools/check_deps_api21.py

      - name: Source reference checks
        working-directory: android
        run: python3 tools/check_sources.py

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build the release APK (both ABIs)
        working-directory: android
        run: |
          MINIFY=${{ github.event.inputs.minify || 'true' }}
          ./gradlew --no-daemon :app:assembleRelease -PminifyRelease="$MINIFY"

      - name: Verify the APK meets the compatibility gate
        working-directory: android
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APK=app/build/outputs/apk/release/app-release.apk
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "minSdkVersion:'21'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" /tmp/badging.txt
          unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -l "$APK" | grep -q "lib/arm64-v8a"
          unzip -l "$APK" | grep -q "assets/feedpack/afghanistan-global-news-master-v0.2.opml"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Name the artifact after the version and the build it actually is
        working-directory: android
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          # The suffix has to describe this build. It used to say "-minified" even for
          # -PminifyRelease=false, which made the release asset list lie about its contents.
          MINIFY=${{ github.event.inputs.minify || 'true' }}
          if [ "$MINIFY" = "true" ]; then SHAPE=minified; else SHAPE=unminified; fi
          # the keystore step reports project-keystore or debug-key, so pass it through as-is
          KEY=${{ steps.keystore.outputs.signed }}
          cp app/build/outputs/apk/release/app-release.apk \
             "afghanistan-news-${VERSION}-${SHAPE}-${KEY}.apk"
          ls -la afghanistan-news-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: afghanistan-news-apk-signed-${{ steps.keystore.outputs.signed }}
          path: android/afghanistan-news-*.apk

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Afghanistan News $GITHUB_REF_NAME" --generate-notes
          # Never --clobber a differently-signed APK over the shipping one: the asset name says
          # which key signed it, so both can coexist and the release page stays truthful.
          gh release upload "$GITHUB_REF_NAME" android/afghanistan-news-*.apk
